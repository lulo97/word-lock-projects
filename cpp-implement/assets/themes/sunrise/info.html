<!doctype html>
<html lang="ja">
  <!-- sunrise: card layout, header band, examples as tinted cards. -->
  <body class="bg-orange-50 min-h-screen flex items-center justify-center antialiased text-stone-800 p-8">
    <div class="w-full max-w-5xl bg-white rounded-3xl border-2 border-amber-300 shadow-xl overflow-hidden">
      <header class="bg-amber-300 px-10 py-6 flex flex-row justify-between items-center">
        <div class="flex flex-row items-end gap-5">
          <h1 id="word-jp" class="text-5xl font-extrabold text-stone-800">{{kanji}}</h1>
          <div class="pb-1 space-y-1">
            <h2 id="word-reading" class="text-xl font-bold text-stone-800">{{hiragana}}</h2>
            <p id="word-romaji" class="text-stone-600 text-[13px] font-semibold">romaji: {{romaji}}</p>

          </div>
        </div>

        <div class="flex flex-row items-center gap-3">
          <button id="speak" class="px-6 py-2.5 bg-rose-500 text-white text-sm font-bold rounded-3xl shadow-xl hover:bg-rose-600">Listen</button>
          <button id="close" class="px-6 py-2.5 bg-white text-stone-800 text-sm font-bold rounded-3xl border-2 border-stone-800 hover:bg-orange-50">Close</button>
        </div>
      </header>

      <div class="px-10 py-8 space-y-8">
        <section class="flex flex-row items-start gap-6">
          <span class="bg-rose-500 text-white text-[11px] font-extrabold tracking-wide uppercase px-4 py-1.5 rounded-3xl">
            Meaning
          </span>
          <div class="space-y-1">
            <p id="word-meaning" class="text-stone-800 text-2xl font-extrabold">{{meaning_ja}}</p>
            <p class="text-stone-500 italic text-sm">{{meaning_ja_romaji}}</p>
            <p class="text-stone-700 text-base font-bold">{{meaning_vi}}</p>

          </div>
        </section>

        <section>
          <p class="text-stone-500 text-[11px] font-extrabold tracking-[0.25em] uppercase mb-3">
            Examples
          </p>

          <div id="examples" class="space-y-4"></div>

          <template id="example-row">
            <div class="flex flex-row justify-between items-start bg-orange-50 border-2 border-amber-300 rounded-3xl px-6 py-4">
              <div class="space-y-1">
                <p class="jp text-stone-800 text-[17px] font-bold"></p>
                <p class="romaji text-stone-500 italic text-[13px] ml-4"></p>
                <p class="en text-stone-600 text-[14px] ml-4"></p>
              </div>
              <button class="listen px-5 py-2 bg-rose-500 text-white text-xs font-bold rounded-3xl shadow-xl hover:bg-rose-600 mt-1">Speak</button>
            </div>
          </template>
        </section>

        <div id="tags" class="flex flex-row items-center gap-2">
          <span class="text-stone-500 text-[11px] font-extrabold tracking-[0.2em] uppercase">Tags:</span>
          <div id="tags-list" class="flex flex-row items-center gap-2"></div>
        </div>

        <template id="tag-chip">
          <span class="bg-amber-300 text-stone-800 px-3 py-1 text-[11px] font-bold rounded-3xl"></span>
        </template>
      </div>
    </div>
  </body>
</html>
