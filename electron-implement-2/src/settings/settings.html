<!DOCTYPE html>
<html class="h-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Settings</title>
    <link rel="stylesheet" href="../../assets/tailwind.css" />
  </head>
  <body class="m-0 flex h-full w-full flex-col gap-4 bg-white p-6 text-black">
    <label class="text-lg font-semibold">Randomly show these tasks</label>
    <label class="flex items-center gap-2 text-base">
      <input id="englishWord" type="checkbox" class="h-4 w-4" />
      English word task
    </label>
    <label class="flex items-center gap-2 text-base">
      <input id="multipleChoice" type="checkbox" class="h-4 w-4" />
      Multiple choice task
    </label>
    <label class="flex items-center gap-2 text-base">
      <input id="japaneseWord" type="checkbox" class="h-4 w-4" />
      Japanese word task
    </label>
    <label class="flex items-center gap-2 text-base">
      <input id="dumbbellWorkout" type="checkbox" class="h-4 w-4" />
      Dumbbell workout task
    </label>
    <label class="flex flex-col gap-1 text-base">
      <span class="flex items-baseline justify-between">
        <span class="font-semibold">Master volume</span>
        <span id="volumeValue">1×</span>
      </span>
      <input id="masterVolume" type="range" min="0" max="4" step="0.5" class="w-full" />
      <span class="flex justify-between text-xs text-gray-600">
        <span>0 (mute)</span>
        <span>4 (max)</span>
      </span>
    </label>
    <div class="mt-auto flex w-full justify-between">
      <button
        id="cancel"
        type="button"
        class="rounded border border-black px-6 py-2 text-base hover:bg-gray-100"
      >
        Cancel
      </button>
      <button
        id="confirm"
        type="button"
        class="rounded bg-black px-6 py-2 text-base text-white hover:bg-gray-800"
      >
        Confirm
      </button>
    </div>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/lodash.min.js"></script>
    <script src="settingsUI.js"></script>
  </body>
</html>
