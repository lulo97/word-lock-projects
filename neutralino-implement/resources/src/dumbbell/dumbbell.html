<!DOCTYPE html>
<html class='h-full'>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws://127.0.0.1:47831; media-src 'self' blob: data:"
    />
  <script src="../bridge/electronAPI.js"></script>
    <title>Dumbbell Workout</title>
    <link rel="stylesheet" href="../../assets/tailwind.css" />
    <link rel="stylesheet" href="../../assets/themes.css" />
    <link rel="stylesheet" href="dumbbell.css" />
    <script src="../ui/theme-boot.js"></script>
  </head>
  <body>
    <main class='flex h-full w-full'>
      <section class='ui-stage relative flex h-full w-[70%] items-center justify-center overflow-hidden'>
        <video id='camera' autoplay playsinline muted class='mirror h-full w-full object-cover'></video>
        <canvas id='overlay' class='mirror pointer-events-none absolute inset-0 h-full w-full'></canvas>
      </section>

      <aside class='ui-aside flex h-full w-[30%] min-w-0 flex-col gap-3 overflow-y-auto p-4'>
        <h1 class='ui-title'>Dumbbell Workout</h1>
        <p id='overall' class='ui-chip self-start'>Total 0 / 20</p>

        <div id='arm-left' class='ui-panel'>
          <div class='flex items-baseline justify-between'>
            <p class='font-bold'>Left arm</p><p id='left-reps' class='text-2xl font-bold'>0 / 10</p>
          </div>
          <div id='left-bar' class='mt-2 flex gap-0.5'></div>
          <p id='left-stage' class='ui-hint mt-2 truncate'>ARM HIDDEN</p>
        </div>

        <div id='arm-right' class='ui-panel'>
          <div class='flex items-baseline justify-between'>
            <p class='font-bold'>Right arm</p><p id='right-reps' class='text-2xl font-bold'>0 / 10</p>
          </div>
          <div id='right-bar' class='mt-2 flex gap-0.5'></div>
          <p id='right-stage' class='ui-hint mt-2 truncate'>ARM HIDDEN</p>
        </div>

        <p id='status' class='ui-hint truncate'>Starting pose tracker...</p>
        <p id='done' class='ui-done hidden'>Training done</p>
      </aside>
    </main>
    <script type='module' src='dumbbell.js'></script>
  </body>
</html>
