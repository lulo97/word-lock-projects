<!doctype html>
<html lang="en">
  <!-- sumi: tray menu, washi paper with hairline ink border. -->
  <body class="bg-[#faf6ec] w-[136px] border border-[#d6cfc0] flex flex-col py-1 select-none font-sans">
    <button id="tray-open" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#0c0a09] hover:bg-[#f5f0e6]">Open app</button>
    <button id="tray-next" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#b93b2e] font-medium hover:bg-[#f5f0e6]">Next UI style</button>
    <button id="tray-settings" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#0c0a09] hover:bg-[#f5f0e6]">Settings</button>
    <button id="tray-stop" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#0c0a09] hover:bg-[#f5f0e6]">Stop app</button>
    <button id="tray-show" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#0c0a09] hover:bg-[#f5f0e6] relative">
      <span class="absolute left-1 top-1/2 -translate-y-1/2">
        <svg class="w-[12px] h-[12px] text-[#b93b2e]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="square" stroke-linejoin="miter" d="M5 13l4 4L19 7"/>
        </svg>
      </span>
      Show countdown
    </button>
    <div class="border-t border-[#d6cfc0] my-0.5"></div>
    <button id="tray-exit" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#0c0a09] hover:bg-[#f5f0e6]">Exit</button>
  </body>
</html>
