<!doctype html>
<html lang="en">
  
  <!-- Background removed, keeping flex centering so you can see it standalone -->
  <body class="min-h-screen flex items-center justify-center antialiased">
    <!-- Context Menu Container -->
    <div
      class="bg-white w-[260px] shadow-[0_4px_16px_rgba(0,0,0,0.2)] border border-gray-200 flex flex-col py-2 select-none"
    >
      <!-- Menu Items -->
      <button id="tray-open"
        class="w-full text-left px-8 py-2.5 text-[15px] text-gray-800 hover:bg-gray-100 transition-colors duration-100"
      >
        Open app
      </button>

      <button id="tray-next"
        class="w-full text-left px-8 py-2.5 text-[15px] text-gray-800 hover:bg-gray-100 transition-colors duration-100"
      >
        Next UI style
      </button>

      <button id="tray-settings"
        class="w-full text-left px-8 py-2.5 text-[15px] text-gray-800 hover:bg-gray-100 transition-colors duration-100"
      >
        Settings
      </button>

      <button id="tray-stop"
        class="w-full text-left px-8 py-2.5 text-[15px] text-gray-800 hover:bg-gray-100 transition-colors duration-100"
      >
        Stop app
      </button>

      <!-- Checked Item -->
      <button id="tray-show"
        class="relative w-full text-left px-8 py-2.5 text-[15px] text-gray-800 hover:bg-gray-100 transition-colors duration-100"
      >
        <!-- Checkmark positioned absolutely to keep text aligned with other items -->
        <span class="absolute left-3 top-1/2 -translate-y-1/2">
          <svg
            class="w-[18px] h-[18px] text-gray-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="square"
              stroke-linejoin="miter"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </span>
        Show countdown
      </button>

      <!-- Separator -->
      <div class="border-t border-gray-300 my-1.5"></div>

      <!-- Exit Item -->
      <button id="tray-exit"
        class="w-full text-left px-8 py-3 text-[15px] text-gray-800 hover:bg-gray-100 transition-colors duration-100"
      >
        Exit
      </button>
    </div>
  </body>
</html>
