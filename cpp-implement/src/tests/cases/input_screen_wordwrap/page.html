<!doctype html>
<html lang="ja">
  <!-- sunrise: warm, bright, rounded, playful.
       Palette: orange-50 (#fff7ed), amber-300 (#fcd34d), rose-500 (#f43f5e). -->
  <body class="bg-[#fff7ed] min-h-screen flex items-center justify-center antialiased text-[#292524] p-6">
    <div class="w-[680px] px-14 py-16 flex flex-col items-center space-y-8 bg-white rounded-2xl border-2 border-[#fcd34d] shadow-xl">
      <div class="w-full flex items-center justify-between">
        <p class="text-[#f43f5e] text-[12px] tracking-wider uppercase font-extrabold">
          Kotoba Lock
        </p>
        <span class="bg-[#fcd34d] text-[#292524] text-[11px] font-bold px-3 py-1 rounded-full">
          study time
        </span>
      </div>

      <h1 id="word-jp" class="text-5xl font-extrabold tracking-wide text-[#292524]">すみません</h1>

      <h3 id="word-reading" class="text-2xl font-bold text-[#f43f5e]">すみません</h3>

      <p id="word-romaji" class="text-[#78716c] text-[13px] tracking-wide font-semibold">Romaji: sumimasen</p>

      <div class="w-full">
        <input
          id="answer"
          type="text"
          spellcheck="false"
          autofocus
          class="w-full h-16 bg-[#fff7ed] border-2 border-[#f43f5e] rounded-2xl outline-none px-6 text-[#292524] text-lg tracking-wide"
        />
        <p id="feedback" class="text-green-600 text-sm mt-3 h-5 font-bold px-2"></p>
        <p id="hint" class="text-[#78716c] text-xs mt-1 px-2">Type the romaji - correct answers unlock automatically</p>
      </div>

      <button id="speak" class="mt-3 px-8 py-3 bg-[#f43f5e] text-white text-sm font-bold rounded-full shadow-lg hover:bg-[#e11d48]">Listen</button>
    </div>
  </body>
</html>
