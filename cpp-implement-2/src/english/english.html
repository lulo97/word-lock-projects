<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Word</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="ui-screen" aria-labelledby="english-kicker">
    <p id="english-kicker" class="ui-kicker">English word</p>
    <div class="ui-word">Serendipity</div>
    <input id="answer" class="ui-input ui-input--big" type="text" placeholder="Type your answer" aria-label="Answer" autocomplete="off" spellcheck="false">
    <p id="feedback" class="ui-feedback" role="status">Type the word and press Enter.</p>
  </main>

  <script src="english.js"></script>
</body>
</html>
