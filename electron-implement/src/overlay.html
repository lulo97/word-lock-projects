<!doctype html>
<html lang="en" class="h-full w-full">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Kotoba Lock</title>
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body class="overlay-body">
    <div class="overlay-card">
      <div class="overlay-label heading">Word show in</div>
      <div id="overlayTime" class="overlay-time">05:00</div>
      <svg
        class="overlay-clock"
        viewBox="0 0 22 22"
        width="13"
        height="13"
        aria-hidden="true"
      >
        <rect
          x="1"
          y="1"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />
        <line
          x1="11"
          y1="11"
          x2="11"
          y2="5"
          stroke="currentColor"
          stroke-width="2"
        />
        <line
          x1="11"
          y1="11"
          x2="16"
          y2="13"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </div>

    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="theme.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
