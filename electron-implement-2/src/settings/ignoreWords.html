<!DOCTYPE html>
<html class='h-full'>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Ignore Words</title>
    <link rel="stylesheet" href="../../assets/tailwind.css" />
    <link rel="stylesheet" href="../../assets/themes.css" />
    <script src="../ui/theme-boot.js"></script>
  </head>
  <body>
    <div class='ui-form'>
      <div class='ui-form__body'>
        <div class='ui-tabs' role='tablist'>
          <button id='tabEnglish' type='button' role='tab' class='ui-tab' aria-selected='true'>English</button>
          <button id='tabJapanese' type='button' role='tab' class='ui-tab' aria-selected='false'>Japanese</button>
        </div>
        <label id='hint' class='ui-hint' for='words'>Comma-separated words only, e.g. abc, xyz, 123</label>
        <textarea id='words' class='ui-textarea h-64' placeholder='word1, word2, word3'></textarea>
        <p id='error' class='ui-feedback hidden' data-state='bad' role='alert'>can't save ignore words</p>
      </div>
      <div class='ui-form__footer'>
        <button id='cancel' type='button' class='ui-btn'>Cancel</button>
        <button id='save' type='button' class='ui-btn ui-btn--primary'>Save</button>
      </div>
    </div>
    <script src="ignoreWordsUI.js"></script>
  </body>
</html>
