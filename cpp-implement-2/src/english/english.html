<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Word</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body class="ui-screen">
  <p class="ui-kicker">Type this word</p>
  <div id="word" class="ui-word"></div>
  <input id="answer" class="ui-input ui-input--big" type="text" placeholder="Type your answer" aria-label="Answer" autocomplete="off" spellcheck="false">
  <p id="feedback" class="ui-feedback" role="status"></p>

  <script src="english.js"></script>
</body>
</html>
