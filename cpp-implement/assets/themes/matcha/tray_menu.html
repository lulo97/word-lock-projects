<!doctype html>
<html lang="en">
  <!-- matcha: tray menu, light lime with leaf green accent. -->
  <body class="bg-white w-[136px] border-2 border-[#d9f99d] flex flex-col py-1 select-none font-sans">
    <button id="tray-open" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1a2e05] hover:bg-[#f7fee7]">Open app</button>
    <button id="tray-next" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#65a30d] font-semibold hover:bg-[#f7fee7]">Next UI style</button>
    <button id="tray-settings" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1a2e05] hover:bg-[#f7fee7]">Settings</button>
    <button id="tray-stop" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1a2e05] hover:bg-[#f7fee7]">Stop app</button>
    <button id="tray-show" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1a2e05] hover:bg-[#f7fee7] relative">
      <span class="absolute left-1 top-1/2 -translate-y-1/2">
        <svg class="w-[12px] h-[12px] text-[#65a30d]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="square" stroke-linejoin="miter" d="M5 13l4 4L19 7"/>
        </svg>
      </span>
      Show countdown
    </button>
    <div class="border-t border-[#d9f99d] my-0.5"></div>
    <button id="tray-exit" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1a2e05] hover:bg-[#f7fee7]">Exit</button>
  </body>
</html>
