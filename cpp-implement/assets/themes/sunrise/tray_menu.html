<!doctype html>
<html lang="en">
  <!-- sunrise: tray menu, warm paper with a soft amber frame. -->
  <body
    class="bg-white w-[136px] border-2 border-[#fcd34d] flex flex-col py-1 select-none font-sans"
  >
    <button id="tray-open"
      class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#292524] hover:bg-[#fff7ed]"
    >
      Open app
    </button>

    <button id="tray-next"
      class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#f43f5e] font-bold hover:bg-[#fff7ed]"
    >
      Next UI style
    </button>

    <button id="tray-settings"
      class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#292524] hover:bg-[#fff7ed]"
    >
      Settings
    </button>

    <button id="tray-stop"
      class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#292524] hover:bg-[#fff7ed]"
    >Stop app</button>

    <button id="tray-show"
      class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#292524] hover:bg-[#fff7ed] relative"
    >
      <span class="absolute left-1 top-1/2 -translate-y-1/2">
        <svg
          class="w-[12px] h-[12px] text-[#f43f5e]"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="square"
            stroke-linejoin="miter"
            d="M5 13l4 4L19 7"
          />
        </svg>
      </span>
      Show countdown
    </button>

    <div class="border-t border-[#fcd34d] my-0.5"></div>

    <button id="tray-exit"
      class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#292524] hover:bg-[#fff7ed]"
    >
      Exit
    </button>
  </body>
</html>
