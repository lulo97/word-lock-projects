<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-white min-h-screen flex items-center justify-center font-sans"
  >
    <div class="relative">
      <div
        class="bg-[#1e293b] w-64 px-4 py-3 flex items-center justify-between shadow-sm"
      >
        <div class="flex flex-col">
          <span
            class="text-[11px] text-slate-400 font-bold tracking-widest uppercase mb-1"
          >
            Word Show In
          </span>
          <span
            class="text-3xl font-bold text-white leading-none tracking-tight"
          >
            55s
          </span>
        </div>

        <div
          class="w-9 h-9 border border-[#60a5fa] rounded-sm flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5 text-[#60a5fa]"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
