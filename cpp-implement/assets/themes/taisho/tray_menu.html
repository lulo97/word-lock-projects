<!doctype html>
<html lang="en">
  <!-- taisho: retro tray menu, cream with teal and gold. -->
  <body class="bg-[#fffaf0] w-[136px] border-2 border-[#0f4c4c] flex flex-col py-1 select-none font-sans">
    <button id="tray-open" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1c1917] hover:bg-[#f5efe1]">Open app</button>
    <button id="tray-next" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#0f4c4c] font-semibold hover:bg-[#f5efe1]">Next UI style</button>
    <button id="tray-settings" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1c1917] hover:bg-[#f5efe1]">Settings</button>
    <button id="tray-stop" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1c1917] hover:bg-[#f5efe1]">Stop app</button>
    <button id="tray-show" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1c1917] hover:bg-[#f5efe1] relative">
      <span class="absolute left-1 top-1/2 -translate-y-1/2">
        <svg class="w-[12px] h-[12px] text-[#b45309]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="square" stroke-linejoin="miter" d="M5 13l4 4L19 7"/>
        </svg>
      </span>
      Show countdown
    </button>
    <div class="border-t border-[#b45309] my-0.5"></div>
    <button id="tray-exit" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#1c1917] hover:bg-[#f5efe1]">Exit</button>
  </body>
</html>
