<div class="bg-gray-100 p-6">
    <p class="text-2xl text-black mb-4">Calculator</p>

    <div class="bg-white p-4 rounded-lg">
        <!-- Added ID here -->
        <p id="display" class="text-2xl text-black">0</p>
    </div>

    <div class="flex gap-2 mt-4">
        <button id="btn-7" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">7</button>
        <button id="btn-8" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">8</button>
        <button id="btn-9" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">9</button>
        <button id="btn-add" class="flex-1 bg-blue-600 text-white rounded-lg p-4 text-xl">+</button>
    </div>

    <div class="flex gap-2 mt-2">
        <button id="btn-4" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">4</button>
        <button id="btn-5" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">5</button>
        <button id="btn-6" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">6</button>
        <button id="btn-sub" class="flex-1 bg-blue-600 text-white rounded-lg p-4 text-xl">-</button>
    </div>

    <div class="flex gap-2 mt-2">
        <button id="btn-1" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">1</button>
        <button id="btn-2" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">2</button>
        <button id="btn-3" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">3</button>
        <button id="btn-clear" class="flex-1 bg-red-500 text-white rounded-lg p-4 text-xl">C</button>
    </div>

    <div class="flex gap-2 mt-2">
        <button id="btn-0" class="flex-1 bg-white text-black rounded-lg p-4 text-xl">0</button>
        <div></div>
        <button id="btn-eq" class="flex-1 bg-blue-600 text-white rounded-lg p-4 text-xl">=</button>
        <div></div>
    </div>
</div>
