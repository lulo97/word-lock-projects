<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Word Info</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div class="ui-scroll">
    <main class="ui-page">
      <section class="ui-panel ui-hero">
        <p class="ui-kicker">Japanese word #<span id="id"></span></p>
        <div id="svg_icon_frame" class="ui-word-icon-frame" hidden>
          <img id="svg_icon" class="ui-word-icon" alt="" aria-hidden="true">
        </div>
        <h1 id="kanji" class="ui-word"></h1>
        <button id="speak-kanji" type="button" class="ui-btn ui-btn--sm">Speak</button>
        <p id="meaning_en" class="text-xl"></p>

        <div class="flex flex-wrap items-center justify-center gap-2">
          <span class="ui-chip">part of speech <b id="part_of_speech"></b></span>
          <span class="ui-chip">hiragana <b id="hiragana"></b></span>
          <button id="speak-hiragana" type="button" class="ui-btn ui-btn--sm">Speak</button>
          <span class="ui-chip">katakana <b id="katakana"></b></span>
          <button id="speak-katakana" type="button" class="ui-btn ui-btn--sm">Speak</button>
          <span class="ui-chip">romaji <b id="romaji"></b></span>
        </div>
      </section>

      <h2 class="ui-section-title">Examples</h2>
      <div id="examples" class="ui-stack"></div>

      <p class="ui-hint text-center">Press <span class="ui-keycap">Enter</span> to exit</p>
    </main>
  </div>

  <script src="speakUI.js"></script>
  <script src="info-render.js"></script>
  <script src="japaneseInfo.js"></script>
</body>
</html>
