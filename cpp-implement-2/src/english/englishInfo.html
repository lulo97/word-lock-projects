<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Word Info</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div class="ui-scroll">
    <main class="ui-page">
      <section class="ui-panel ui-hero">
        <p class="ui-kicker">English word #<span id="id"></span></p>
        <h1 id="word" class="ui-word"></h1>
        <button id="speak-word" type="button" class="ui-btn ui-btn--sm">Speak</button>
        <p id="meaning_vi" class="text-xl"></p>
        <span class="ui-chip">part of speech <b id="part_of_speech"></b></span>
      </section>

      <h2 class="ui-section-title">Examples</h2>
      <div id="examples" class="ui-stack"></div>

      <p class="ui-hint text-center">Press <span class="ui-keycap">Enter</span> to exit</p>
    </main>
  </div>

  <script src="speakUI.js"></script>
  <script src="info-render.js"></script>
  <script src="englishInfo.js"></script>
</body>
</html>
