<!doctype html>
<html lang="ja">
  <!-- taisho: retro teal, burgundy, gold on cream. -->
  <body class="bg-[#f5efe1] min-h-screen flex items-center justify-center antialiased text-[#1c1917] p-6">
    <div class="w-[680px] px-14 py-16 flex flex-col items-center space-y-8 bg-[#fffaf0] rounded-md border-2 border-[#0f4c4c] shadow-xl">
      <div class="w-full flex items-center justify-between">
        <p class="text-[#0f4c4c] text-[12px] tracking-wider uppercase font-semibold">Kotoba Lock</p>
        <span class="bg-[#fffaf0] border border-[#b45309] text-[#b45309] text-[11px] font-semibold px-3 py-1 rounded-sm">study time</span>
      </div>
      <h1 id="word-jp" class="text-5xl font-semibold tracking-wide text-[#1c1917]">{{kanji}}</h1>
      <h3 id="word-reading" class="text-2xl font-semibold text-[#7f1d1d]">{{hiragana}}</h3>
      <p id="word-romaji" class="text-[#57534e] text-[13px] tracking-wide font-semibold">Romaji: {{romaji}}</p>
      <div class="w-full">
        <input id="answer" type="text" spellcheck="false" autofocus class="w-full h-16 bg-[#f5efe1] border-2 border-[#0f4c4c] rounded-sm outline-none px-6 text-[#1c1917] text-lg tracking-wide"/>
        <p id="feedback" class="text-green-700 text-sm mt-3 h-5 font-semibold px-2"></p>
        <p id="hint" class="text-[#57534e] text-xs mt-1 px-2">Type the romaji - correct answers unlock automatically</p>
      </div>
      <button id="speak" class="mt-3 px-8 py-3 bg-[#0f4c4c] text-[#fffaf0] text-sm font-semibold rounded-sm shadow-lg hover:bg-[#115e59]">Listen</button>
    </div>
  </body>
</html>
