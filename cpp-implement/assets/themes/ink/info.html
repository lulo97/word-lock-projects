<!doctype html>
<html lang="ja">
  <!-- ink: calm, minimal, dark. Single column, hairline rules. -->
  <body class="bg-slate-900 min-h-screen flex items-center justify-center antialiased text-slate-100 p-10">
    <div class="w-full max-w-4xl px-14 py-12 rounded-md border border-slate-700 bg-[#0e1726]">
      <header class="flex justify-between items-start pb-8 border-b border-slate-700">
        <div class="space-y-2">
          <h1 id="word-jp" class="text-6xl font-light tracking-widest text-slate-100">{{kanji}}</h1>
          <h2 id="word-reading" class="text-xl font-light tracking-wide text-[#818cf8]">{{hiragana}}</h2>
          <p id="word-romaji" class="text-slate-400 text-[13px] tracking-widest">romaji: {{romaji}}</p>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button id="speak" class="px-5 py-2 bg-[#0e1726] border border-slate-700 text-[#818cf8] text-sm tracking-wide hover:border-[#818cf8]">Listen</button>
          <button id="close" class="px-5 py-2 bg-[#0e1726] border border-slate-700 text-slate-400 text-sm tracking-wide hover:border-slate-400">Close</button>
        </div>
      </header>

      <section class="pt-8 space-y-3">
        <p class="text-[#818cf8] text-[11px] tracking-widest uppercase">Meaning</p>
        <p id="word-meaning" class="text-slate-100 text-2xl font-light">{{meaning_ja}}</p>
        <p class="text-slate-400 italic text-sm">{{meaning_ja_romaji}}</p>
        <p class="text-slate-300 text-base font-light">{{meaning_vi}}</p>
      </section>

      <section class="pt-10">
        <p class="text-[#818cf8] text-[11px] tracking-widest uppercase mb-4">Examples</p>

        <div id="examples"></div>

        <template id="example-row">
          <div class="flex justify-between items-start py-4 border-b border-slate-800">
            <div class="space-y-1">
              <p class="jp text-slate-100 text-[17px] font-light"></p>
              <p class="romaji text-slate-500 italic text-[13px] ml-3"></p>
              <p class="en text-slate-400 text-[14px] ml-3"></p>
            </div>
            <button class="listen px-4 py-1 bg-[#0e1726] border border-slate-700 text-[#818cf8] text-xs tracking-wide hover:border-[#818cf8] mt-1">Speak</button>
          </div>
        </template>
      </section>

      <div id="tags" class="flex items-center gap-2 pt-8">
        <span class="text-slate-500 text-[11px] tracking-widest uppercase">Tags:</span>
        <div id="tags-list" class="flex items-center gap-2"></div>
      </div>

      <template id="tag-chip">
        <span class="bg-[#0e1726] border border-slate-700 text-slate-400 px-2 py-0.5 text-[11px] tracking-wide rounded-md"></span>
      </template>
    </div>
  </body>
</html>
