<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiple Choice</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="ui-screen" aria-labelledby="mcq-kicker">
    <p id="mcq-kicker" class="ui-kicker">Multiple choice</p>
    <div class="ui-title text-center">What does “serendipity” mean?</div>
    <div class="ui-stack items-center">
      <button type="button" class="ui-btn ui-btn--choice" data-choice="A" data-result="ok">A. A lucky discovery</button>
      <button type="button" class="ui-btn ui-btn--choice" data-choice="B" data-result="bad">B. A planned routine</button>
      <button type="button" class="ui-btn ui-btn--choice" data-choice="C" data-result="bad">C. A sudden mistake</button>
      <button type="button" class="ui-btn ui-btn--choice" data-choice="D" data-result="bad">D. A quiet conversation</button>
    </div>
  </main>

  <script src="mcq.js"></script>
</body>
</html>
