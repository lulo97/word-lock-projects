<!DOCTYPE html>
<html class="h-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; media-src 'self' data:"
    />
    <title>English Word Info</title>
    <link rel="stylesheet" href="../../assets/tailwind.css" />
  </head>
  <body class="m-0 flex h-full w-full flex-col items-center bg-white text-black">
    <main class="flex w-full flex-1 flex-col items-center justify-center gap-4">
      <h1 class="text-3xl font-bold">English Word Info</h1>
      <table class="w-full max-w-2xl table-auto text-left text-lg">
        <thead>
          <tr class="border-b border-gray-300">
            <th class="px-3 py-2 font-semibold">column</th>
            <th class="px-3 py-2 font-semibold">value</th>
            <th class="px-3 py-2 font-semibold">speak</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b border-gray-100">
            <th class="px-3 py-2 text-left font-semibold align-top">id</th>
            <td id="id" class="px-3 py-2 align-top"></td>
            <td class="px-3 py-2 align-top"></td>
          </tr>
          <tr class="border-b border-gray-100">
            <th class="px-3 py-2 text-left font-semibold align-top">word</th>
            <td id="word" class="px-3 py-2 align-top"></td>
            <td class="px-3 py-2 align-top">
              <button
                id="speak-word"
                type="button"
                class="speak-button rounded border border-gray-400 px-2 py-0.5 text-sm text-gray-700 hover:bg-gray-100"
              >
                Speak
              </button>
            </td>
          </tr>
          <tr class="border-b border-gray-100">
            <th class="px-3 py-2 text-left font-semibold align-top">meaning_vi</th>
            <td id="meaning_vi" class="px-3 py-2 align-top"></td>
            <td class="px-3 py-2 align-top"></td>
          </tr>
          <tr class="border-b border-gray-100">
            <th class="px-3 py-2 text-left font-semibold align-top">examples</th>
            <td class="px-3 py-2 align-top">
              <ol id="examples" class="list-inside list-decimal space-y-1"></ol>
            </td>
            <td class="px-3 py-2 align-top"></td>
          </tr>
          <tr class="border-b border-gray-100">
            <th class="px-3 py-2 text-left font-semibold align-top">examples_vi</th>
            <td class="px-3 py-2 align-top">
              <ol id="examples_vi" class="list-inside list-decimal space-y-1"></ol>
            </td>
            <td class="px-3 py-2 align-top"></td>
          </tr>
        </tbody>
      </table>
    </main>
    <p class="mb-6 text-sm text-gray-500">Enter to exit</p>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/lodash.min.js"></script>
    <script src="../tts/speakUI.js"></script>
    <script src="englishInfo.js"></script>
  </body>
</html>
