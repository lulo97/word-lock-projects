<!doctype html>
<html lang="en">
  <!-- sakura: tray menu, soft pink with plum accents. -->
  <body class="bg-white w-[136px] border-2 border-[#fbcfe8] flex flex-col py-1 select-none font-sans">
    <button id="tray-open" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#500724] hover:bg-[#fdf2f8]">Open app</button>
    <button id="tray-next" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#db2777] font-medium hover:bg-[#fdf2f8]">Next UI style</button>
    <button id="tray-settings" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#500724] hover:bg-[#fdf2f8]">Settings</button>
    <button id="tray-stop" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#500724] hover:bg-[#fdf2f8]">Stop app</button>
    <button id="tray-show" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#500724] hover:bg-[#fdf2f8] relative">
      <span class="absolute left-1 top-1/2 -translate-y-1/2">
        <svg class="w-[12px] h-[12px] text-[#db2777]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="square" stroke-linejoin="miter" d="M5 13l4 4L19 7"/>
        </svg>
      </span>
      Show countdown
    </button>
    <div class="border-t border-[#fbcfe8] my-0.5"></div>
    <button id="tray-exit" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#500724] hover:bg-[#fdf2f8]">Exit</button>
  </body>
</html>
