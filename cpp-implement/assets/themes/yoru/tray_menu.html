<!doctype html>
<html lang="en">
  <!-- yoru: midnight tray menu. -->
  <body class="bg-[#1e1b4b] w-[136px] border border-[#312e81] flex flex-col py-1 select-none font-sans">
    <button id="tray-open" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#e0e7ff] hover:bg-[#312e81]">Open app</button>
    <button id="tray-next" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#22d3ee] font-medium hover:bg-[#312e81]">Next UI style</button>
    <button id="tray-settings" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#e0e7ff] hover:bg-[#312e81]">Settings</button>
    <button id="tray-stop" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#e0e7ff] hover:bg-[#312e81]">Stop app</button>
    <button id="tray-show" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#e0e7ff] hover:bg-[#312e81] relative">
      <span class="absolute left-1 top-1/2 -translate-y-1/2">
        <svg class="w-[12px] h-[12px] text-[#22d3ee]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="square" stroke-linejoin="miter" d="M5 13l4 4L19 7"/>
        </svg>
      </span>
      Show countdown
    </button>
    <div class="border-t border-[#312e81] my-0.5"></div>
    <button id="tray-exit" class="w-full text-left pl-5 pr-2.5 py-1 text-[12px] text-[#e0e7ff] hover:bg-[#312e81]">Exit</button>
  </body>
</html>
