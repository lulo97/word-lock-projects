<!doctype html>
<html lang="en">
  <!-- ink: the countdown chip stays dark and quiet. -->
  <body
    class="bg-slate-900 w-[204px] h-[51px] px-3 pt-2 pb-3 flex items-center justify-between font-sans"
  >
    <div class="flex flex-col justify-center">
      <span
        class="text-[9px] text-slate-400 font-bold tracking-wider uppercase mb-[1px]"
      >
        Word Show In
      </span>
      <span id="countdown" class="text-lg font-bold text-slate-100 leading-none tracking-tight">
        55s
      </span>
    </div>

    <div
      class="w-6 h-6 border border-[#818cf8] rounded-sm flex items-center justify-center"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="w-4 h-4 text-[#818cf8]"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>
    </div>
  </body>
</html>
