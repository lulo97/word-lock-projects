<!DOCTYPE html>
<html class='h-full'>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; media-src 'self' data:"
    />
    <title>Japanese Word Info</title>
    <link rel="stylesheet" href="../../assets/tailwind.css" />
    <link rel="stylesheet" href="../../assets/themes.css" />
    <script src="../ui/theme-boot.js"></script>
  </head>
  <body>
    <div class='ui-scroll'>
      <main class='ui-page'>
        <section class='ui-panel ui-hero'>
          <p class='ui-kicker'>Japanese word #<span id='id'></span></p>
          <h1 id='kanji' class='ui-word'></h1>
          <button id='speak-kanji' type='button' class='ui-btn ui-btn--sm'>Speak</button>
          <p id='meaning_en' class='text-xl'></p>
          <div class='flex flex-wrap items-center justify-center gap-2'>
            <span class='ui-chip'>hiragana <b id='hiragana'></b>
              <button id='speak-hiragana' type='button' class='ui-btn ui-btn--sm'>Speak</button></span>
            <span class='ui-chip'>katakana <b id='katakana'></b>
              <button id='speak-katakana' type='button' class='ui-btn ui-btn--sm'>Speak</button></span>
            <span class='ui-chip'>romaji <b id='romaji'></b></span>
          </div>
        </section>

        <h2 class='ui-section-title'>Examples</h2>
        <div id='examples' class='ui-stack'></div>

        <p class='ui-hint text-center'>Press <span class='ui-keycap'>Enter</span> to exit</p>
      </main>
    </div>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/lodash.min.js"></script>
    <script src="../tts/speakUI.js"></script>
    <script src="../ui/info-render.js"></script>
    <script src="japaneseInfo.js"></script>
  </body>
</html>
